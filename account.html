<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameLand | ورود</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0b1025,#281052);
    color:white;
}

.box{
    width:92%;
    max-width:420px;
    padding:28px;
    background:#181c35;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.logo{
    font-size:55px;
}

input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:0;
    border-radius:12px;
    background:#292e4b;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    background:#1976ff;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.registerButton{
    background:#00a86b;
}

.link{
    margin-top:18px;
    color:#55aaff;
    cursor:pointer;
}

.message{
    min-height:25px;
    margin-top:15px;
}

#registerBox{
    display:none;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">🎮</div>

<h1>GameLand</h1>

<p>ورود به حساب کاربری</p>


<!-- ورود -->

<div id="loginBox">

<input
id="loginName"
type="text"
placeholder="نام کاربری"
autocomplete="username"
>

<input
id="loginPass"
type="password"
placeholder="رمز عبور"
autocomplete="current-password"
>

<button onclick="loginUser()">
🔑 ورود
</button>

<div
class="link"
onclick="showRegister()"
>
حساب نداری؟ ثبت‌نام کن
</div>

</div>


<!-- ثبت نام -->

<div id="registerBox">

<h2>📝 ساخت حساب</h2>

<input
id="regName"
type="text"
placeholder="نام کاربری"
>

<input
id="regPass"
type="password"
placeholder="رمز عبور"
>

<input
id="regPass2"
type="password"
placeholder="تکرار رمز عبور"
>

<button
class="registerButton"
onclick="registerUser()"
>
ساخت حساب
</button>

<div
class="link"
onclick="showLogin()"
>
قبلاً حساب ساخته‌ام
</div>

</div>


<div
id="message"
class="message"
></div>

</div>


<script>

/* =========================
   کاربران
========================= */

function getUsers(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "gamelandUsers"
            ) || "{}"
        );

    }catch(error){

        return {};

    }

}


/* =========================
   ذخیره کاربران
========================= */

function saveUsers(users){

    localStorage.setItem(
        "gamelandUsers",
        JSON.stringify(users)
    );

}


/* =========================
   پیام
========================= */

function showMessage(text){

    document.getElementById(
        "message"
    ).textContent = text;

}


/* =========================
   نمایش ثبت نام
========================= */

function showRegister(){

    document.getElementById(
        "loginBox"
    ).style.display = "none";

    document.getElementById(
        "registerBox"
    ).style.display = "block";

    showMessage("");

}


/* =========================
   نمایش ورود
========================= */

function showLogin(){

    document.getElementById(
        "registerBox"
    ).style.display = "none";

    document.getElementById(
        "loginBox"
    ).style.display = "block";

    showMessage("");

}


/* =========================
   ثبت نام
========================= */

function registerUser(){

    const name =
        document.getElementById(
            "regName"
        ).value.trim();

    const pass =
        document.getElementById(
            "regPass"
        ).value;

    const pass2 =
        document.getElementById(
            "regPass2"
        ).value;


    if(name.length < 3){

        showMessage(
            "نام کاربری باید حداقل ۳ حرف باشد."
        );

        return;
    }


    if(pass.length < 4){

        showMessage(
            "رمز عبور باید حداقل ۴ کاراکتر باشد."
        );

        return;
    }


    if(pass !== pass2){
showMessage(
            "رمزهای عبور یکسان نیستند."
        );

        return;
    }


    const users = getUsers();


    if(users[name]){

        showMessage(
            "این نام کاربری قبلاً ساخته شده است."
        );

        return;
    }


    users[name] = {

        password: pass

    };


    saveUsers(users);


    document.getElementById(
        "loginName"
    ).value = name;


    document.getElementById(
        "regName"
    ).value = "";

    document.getElementById(
        "regPass"
    ).value = "";

    document.getElementById(
        "regPass2"
    ).value = "";


    showLogin();


    showMessage(
        "✅ حساب ساخته شد؛ حالا وارد شو."
    );

}


/* =========================
   ورود
========================= */

function loginUser(){

    const name =
        document.getElementById(
            "loginName"
        ).value.trim();

    const pass =
        document.getElementById(
            "loginPass"
        ).value;


    const users = getUsers();


    if(!users[name]){

        showMessage(
            "❌ این حساب وجود ندارد."
        );

        return;
    }


    if(users[name].password !== pass){

        showMessage(
            "❌ رمز عبور اشتباه است."
        );

        return;
    }


    /*
      ذخیره کاربر وارد شده
    */

    localStorage.setItem(
        "gamelandCurrentUser",
        name
    );


    showMessage(
        "✅ ورود موفق بود..."
    );


    /*
      برگشت به صفحه اصلی GameLand
      که همه بازی‌ها داخل آن هستند
    */

    setTimeout(
        function(){

            window.location.href =
                "index.html";

        },
        500
    );

}

</script>

</body>
</html>
