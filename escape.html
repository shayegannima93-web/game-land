<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GameLand | فرار از سفینه</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050816;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
    z-index:5;
}

.info{
    padding:10px 14px;
    border-radius:12px;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:15px;
    border:1px solid rgba(255,255,255,.15);
}

#message{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    background:rgba(0,0,0,.75);
    padding:25px;
    border-radius:18px;
    text-align:center;
    z-index:10;
    display:none;
}

#message h1{
    margin-top:0;
}

#startButton,
#restartButton{
    border:0;
    padding:13px 25px;
    border-radius:12px;
    background:#1976ff;
    color:white;
    font-size:17px;
    cursor:pointer;
}

#controls{
    position:fixed;
    bottom:25px;
    left:0;
    right:0;
    display:flex;
    justify-content:space-between;
    padding:0 25px;
    z-index:6;
    pointer-events:none;
}

.controlGroup{
    display:flex;
    gap:15px;
    pointer-events:auto;
}

.control{
    width:70px;
    height:70px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(20,30,60,.75);
    color:white;
    font-size:28px;
    display:flex;
    justify-content:center;
    align-items:center;
    user-select:none;
}

.control:active{
    background:rgba(40,100,220,.9);
}

@media(min-width:800px){

    .control{
        width:60px;
        height:60px;
    }

}
</style>
</head>

<body>

<div id="hud">

    <div class="info">
        🚀 امتیاز: <span id="score">0</span>
    </div>

    <div class="info">
        ❤️ جان: <span id="health">3</span>
    </div>

</div>


<div id="message">

    <h1 id="messageTitle">
        🚀 فرار از سفینه
    </h1>

    <p id="messageText">
        از موانع فرار کن!
    </p>

    <button id="startButton">
        شروع بازی
    </button>

</div>


<div id="controls">

    <div class="controlGroup">

        <div
            class="control"
            id="left"
        >
            ◀
        </div>

        <div
            class="control"
            id="right"
        >
            ▶
        </div>

    </div>

    <div class="controlGroup">

        <div
            class="control"
            id="up"
        >
            ▲
        </div>

        <div
            class="control"
            id="down"
        >
            ▼
        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   تنظیمات
========================= */

let scene;
let camera;
let renderer;

let player;

let obstacles = [];

let running = false;

let score = 0;

let health = 3;

let speed = 0.12;

let lastTime = 0;

const keys = {};


/* =========================
   صفحه
========================= */

const scoreElement =
    document.getElementById("score");

const healthElement =
    document.getElementById("health");

const message =
    document.getElementById("message");

const messageTitle =
    document.getElementById("messageTitle");

const messageText =
    document.getElementById("messageText");

const startButton =
    document.getElementById("startButton");


/* =========================
   صحنه
========================= */

function createGame(){

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x050816);
camera =
        new THREE.PerspectiveCamera(
            65,
            window.innerWidth /
            window.innerHeight,
            0.1,
            1000
        );


    camera.position.set(
        0,
        4,
        8
    );


    renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    document.body.appendChild(
        renderer.domElement
    );


    /* نور */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            0.8
        );

    scene.add(ambient);


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            1.5
        );

    light.position.set(
        5,
        10,
        5
    );

    scene.add(light);


    /* زمین */

    const groundGeometry =
        new THREE.PlaneGeometry(
            100,
            200
        );


    const groundMaterial =
        new THREE.MeshStandardMaterial({
            color:0x111827
        });


    const ground =
        new THREE.Mesh(
            groundGeometry,
            groundMaterial
        );


    ground.rotation.x =
        -Math.PI / 2;


    ground.position.z =
        -50;


    scene.add(ground);


    /* خطوط مسیر */

    for(
        let i = -100;
        i < 100;
        i += 5
    ){

        const geometry =
            new THREE.BoxGeometry(
                0.15,
                0.03,
                2
            );


        const material =
            new THREE.MeshBasicMaterial({
                color:0x4f8cff
            });


        const line =
            new THREE.Mesh(
                geometry,
                material
            );


        line.position.set(
            0,
            0.03,
            i
        );


        scene.add(line);

    }


    createPlayer();


    window.addEventListener(
        "resize",
        resize
    );


    animate();

}


/* =========================
   بازیکن
========================= */

function createPlayer(){

    const group =
        new THREE.Group();


    const bodyGeometry =
        new THREE.BoxGeometry(
            1.3,
            0.5,
            2.2
        );


    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color:0x1976ff,
            metalness:0.5,
            roughness:0.3
        });


    const body =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );


    body.position.y =
        0.6;


    group.add(body);


    const cockpitGeometry =
        new THREE.SphereGeometry(
            0.45,
            20,
            12
        );


    const cockpitMaterial =
        new THREE.MeshStandardMaterial({
            color:0x55dfff,
            metalness:0.3,
            roughness:0.2
        });


    const cockpit =
        new THREE.Mesh(
            cockpitGeometry,
            cockpitMaterial
        );


    cockpit.scale.set(
        1,
        0.55,
        1.2
    );


    cockpit.position.set(
        0,
        0.95,
        -0.25
    );


    group.add(cockpit);


    /* بال چپ */

    const wingGeometry =
        new THREE.BoxGeometry(
            2.8,
            0.12,
            0.8
        );


    const wingMaterial =
        new THREE.MeshStandardMaterial({
            color:0x31558c
        });


    const wings =
        new THREE.Mesh(
            wingGeometry,
            wingMaterial
        );


    wings.position.y =
        0.55;


    group.add(wings);


    /* موتور */

    const engineGeometry =
        new THREE.CylinderGeometry(
            0.25,
            0.35,
            0.6,
            16
        );


    const engineMaterial =
        new THREE.MeshBasicMaterial({
            color:0xff7b00
        });


    for(
        const x of [-0.45,0.45]
    ){
const engine =
            new THREE.Mesh(
                engineGeometry,
                engineMaterial
            );


        engine.rotation.x =
            Math.PI / 2;


        engine.position.set(
            x,
            0.55,
            1.15
        );


        group.add(engine);

    }


    group.position.set(
        0,
        0,
        5
    );


    player = group;

    scene.add(player);

}


/* =========================
   مانع
========================= */

function createObstacle(){

    const size =
        1 +
        Math.random() * 1.5;


    const geometry =
        new THREE.BoxGeometry(
            size,
            size,
            size
        );


    const material =
        new THREE.MeshStandardMaterial({
            color:
                new THREE.Color(
                    Math.random(),
                    0.2,
                    0.3
                )
        });


    const obstacle =
        new THREE.Mesh(
            geometry,
            material
        );


    const lane =
        Math.floor(
            Math.random() * 5
        ) - 2;


    obstacle.position.set(
        lane * 2,
        size / 2,
        -80
    );


    scene.add(obstacle);

    obstacles.push(obstacle);

}


/* =========================
   شروع
========================= */

function startGame(){

    score = 0;

    health = 3;

    speed = 0.12;

    scoreElement.textContent =
        score;

    healthElement.textContent =
        health;


    player.position.set(
        0,
        0,
        5
    );


    for(
        const obstacle of obstacles
    ){

        scene.remove(
            obstacle
        );

    }


    obstacles = [];

    running = true;

    message.style.display =
        "none";

}


/* =========================
   پایان
========================= */

function gameOver(){

    running = false;

    messageTitle.textContent =
        "💥 بازی تمام شد";

    messageText.textContent =
        "امتیاز شما: " +
        score;

    startButton.textContent =
        "🔄 دوباره بازی کن";

    message.style.display =
        "block";

}


/* =========================
   برخورد
========================= */

function checkCollision(
    a,
    b
){

    const distance =
        a.position.distanceTo(
            b.position
        );


    return distance < 1.7;

}


/* =========================
   آپدیت
========================= */

function update(){

    if(!running){
        return;
    }


    /* حرکت */

    if(keys.left){

        player.position.x -=
            0.16;

    }


    if(keys.right){

        player.position.x +=
            0.16;

    }


    if(keys.up){

        player.position.z -=
            0.12;

    }


    if(keys.down){

        player.position.z +=
            0.12;

    }


    /* محدودیت */

    player.position.x =
        Math.max(
            -4,
            Math.min(
                4,
                player.position.x
            )
        );


    player.position.z =
        Math.max(
            -2,
            Math.min(
                7,
                player.position.z
            )
        );


    /* ساخت مانع */

    if(
        Math.random()
        <
        0.025
    ){

        createObstacle();

    }


    /* حرکت موانع */

    for(
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ){

        const obstacle =
            obstacles[i];


        obstacle.position.z +=
            speed;


        obstacle.rotation.x +=
            0.02;

        obstacle.rotation.y +=
            0.03;


        if(
            checkCollision(
                player,
                obstacle
            )
        ){

            scene.remove(
                obstacle
            );


            obstacles.splice(
                i,
                1
            );


            health--;

            healthElement.textContent =
                health;


            if(
                health <= 0
            ){

                gameOver();

            }

            continue;

        }
if(
            obstacle.position.z >
            12
        ){

            scene.remove(
                obstacle
            );


            obstacles.splice(
                i,
                1
            );

            score++;

            scoreElement.textContent =
                score;

        }

    }


    /* افزایش سختی */

    speed +=
        0.00003;

}


/* =========================
   انیمیشن
========================= */

function animate(time){

    requestAnimationFrame(
        animate
    );


    update();


    /* دوربین */

    if(player){

        camera.position.x +=
            (
                player.position.x -
                camera.position.x
            ) * 0.08;


        camera.position.z =
            player.position.z + 8;


        camera.lookAt(
            player.position.x,
            0,
            player.position.z - 5
        );

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================
   تغییر اندازه
========================= */

function resize(){

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =========================
   کیبورد
========================= */

window.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ){

            keys.left = true;

        }


        if(
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ){

            keys.right = true;

        }


        if(
            event.key === "ArrowUp" ||
            event.key.toLowerCase() === "w"
        ){

            keys.up = true;

        }


        if(
            event.key === "ArrowDown" ||
            event.key.toLowerCase() === "s"
        ){

            keys.down = true;

        }

    }
);


window.addEventListener(
    "keyup",
    function(event){

        if(
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ){

            keys.left = false;

        }


        if(
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ){

            keys.right = false;

        }


        if(
            event.key === "ArrowUp" ||
            event.key.toLowerCase() === "w"
        ){

            keys.up = false;

        }


        if(
            event.key === "ArrowDown" ||
            event.key.toLowerCase() === "s"
        ){

            keys.down = false;

        }

    }
);


/* =========================
   کنترل لمسی
========================= */

function touchControl(
    element,
    key
){

    element.addEventListener(
        "touchstart",
        function(event){

            event.preventDefault();

            keys[key] = true;

        },
        {
            passive:false
        }
    );


    element.addEventListener(
        "touchend",
        function(event){

            event.preventDefault();

            keys[key] = false;

        },
        {
            passive:false
        }
    );


    element.addEventListener(
        "touchcancel",
        function(){

            keys[key] = false;

        }
    );

}


touchControl(
    document.getElementById("left"),
    "left"
);

touchControl(
    document.getElementById("right"),
    "right"
);

touchControl(
    document.getElementById("up"),
    "up"
);

touchControl(
    document.getElementById("down"),
    "down"
);


/* =========================
   شروع دکمه
========================= */

startButton.addEventListener(
    "click",
    startGame
);


/* =========================
   شروع اولیه
========================= */

createGame();

message.style.display =
    "block";

</script>

</body>
</html>
