<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Escape The Shadow Deluxe</title>

<style>
    #controls{
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
}

#controls button{
    width:70px;
    height:70px;
    font-size:30px;
    margin:5px;
}
body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    margin:auto;
    background:#1f1f1f;
}

#restart{
    position:fixed;
    top:10px;
    right:10px;
    z-index:1000;
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>

<button id="restart">🔄 Restart</button>

<canvas id="game" width="1000" height="600"></canvas>
<div id="controls">
    <button id="up">⬆️</button><br>
    <button id="left">⬅️</button>
    <button id="down">⬇️</button>
    <button id="right">➡️</button>
</div>
<script>
document.getElementById("up").ontouchstart = () => keys["w"] = true;
document.getElementById("up").ontouchend = () => keys["w"] = false;

document.getElementById("down").ontouchstart = () => keys["s"] = true;
document.getElementById("down").ontouchend = () => keys["s"] = false;

document.getElementById("left").ontouchstart = () => keys["a"] = true;
document.getElementById("left").ontouchend = () => keys["a"] = false;

document.getElementById("right").ontouchstart = () => keys["d"] = true;
document.getElementById("right").ontouchend = () => keys["d"] = false;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let state = "menu";

let highScore =
parseInt(localStorage.getItem("shadowHighScore")) || 0;

const player = {
    x:100,
    y:100,
    size:30,
    speed:5
};

const shadows = [
    {x:900,y:100,speed:1.5},
    {x:850,y:500,speed:1.8},
    {x:700,y:300,speed:2.1}
];

const obstacles = [
    {x:250,y:120,w:250,h:30},
    {x:550,y:200,w:30,h:250},
    {x:700,y:100,w:180,h:30},
    {x:150,y:450,w:300,h:30},
    {x:820,y:320,w:30,h:180}
];

let coin = {
    x:400,
    y:300,
    size:15
};

let coinsCollected = 0;
let startTime = Date.now();
let gameOver = false;
let keys = {};

document.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if(state === "menu"){
        state = "game";
        startTime = Date.now();
    }

});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

document.getElementById("restart").onclick =
restartGame;

function restartGame(){

    player.x = 100;
    player.y = 100;

    shadows[0].x = 900;
    shadows[0].y = 100;

    shadows[1].x = 850;
    shadows[1].y = 500;

    shadows[2].x = 700;
    shadows[2].y = 300;

    coinsCollected = 0;
    gameOver = false;
    state = "game";
    startTime = Date.now();

    spawnCoin();
}

function spawnCoin(){

    coin.x =
    Math.random() * (canvas.width - 50) + 20;

    coin.y =
    Math.random() * (canvas.height - 50) + 20;
}

function collideRect(a,b){

    return (
        a.x < b.x + b.w &&
        a.x + a.size > b.x &&
        a.y < b.y + b.h &&
        a.y + a.size > b.y
    );

}

function update(){

    if(state !== "game") return;
    if(gameOver) return;

    let oldX = player.x;
    let oldY = player.y;

    if(keys["w"]) player.y -= player.speed;
    if(keys["s"]) player.y += player.speed;
    if(keys["a"]) player.x -= player.speed;
    if(keys["d"]) player.x += player.speed;

    player.x = Math.max(
        0,
        Math.min(canvas.width-player.size,player.x)
    );

    player.y = Math.max(
        0,
        Math.min(canvas.height-player.size,player.y)
    );

    obstacles.forEach(obs => {

        if(collideRect(player,obs)){
            player.x = oldX;
            player.y = oldY;
        }

    });

    let seconds =
    Math.floor((Date.now()-startTime)/1000);

    shadows.forEach((shadow,index)=>{

        shadow.speed =
        1.5 + index*0.5 + seconds*0.02;

        let dx = player.x - shadow.x;
        let dy = player.y - shadow.y;

        let dist =
        Math.sqrt(dx*dx + dy*dy);

        if(dist > 0){

            shadow.x +=
            dx/dist * shadow.speed;

            shadow.y +=
            dy/dist * shadow.speed;
        }

        if(dist < 25){

            gameOver = true;

            let score =
            seconds + coinsCollected*10;

            if(score > highScore){

                highScore = score;

                localStorage.setItem(
                    "shadowHighScore",
                    highScore
                );
            }
        }

    });

    let coinDist = Math.sqrt(
        Math.pow(player.x-coin.x,2)+
        Math.pow(player.y-coin.y,2)
    );

    if(coinDist < 30){

        coinsCollected++;
        spawnCoin();
    }

}

function drawMenu(){

    ctx.fillStyle="#111";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="white";
    ctx.font="60px Arial";
    ctx.fillText(
        "ESCAPE THE SHADOW",
        180,
        220
    );

    ctx.font="30px Arial";
    ctx.fillText(
        "Press Any Key To Start",
        300,
        320
    );

}

function draw(){

    if(state==="menu"){
        drawMenu();
        return;
    }

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle="#666";

    obstacles.forEach(obs=>{

        ctx.fillRect(
            obs.x,
            obs.y,
            obs.w,
            obs.h
        );

    });

    ctx.fillStyle="gold";

    ctx.beginPath();
    ctx.arc(
        coin.x,
        coin.y,
        coin.size,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.fillStyle="deepskyblue";

    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );

    ctx.fillStyle="black";

    shadows.forEach(shadow=>{

        ctx.beginPath();

        ctx.arc(
            shadow.x,
            shadow.y,
            18,
            0,
            Math.PI*2
        );

        ctx.fill();

    });

    let seconds =
    Math.floor((Date.now()-startTime)/1000);

    let score =
    seconds + coinsCollected*10;

    ctx.fillStyle="white";
    ctx.font="24px Arial";

    ctx.fillText(
        "Score: " + score,
        20,
        30
    );

    ctx.fillText(
        "Coins: " + coinsCollected,
        20,
        60
    );

    ctx.fillText(
        "High Score: " + highScore,
        20,
        90
    );

    if(gameOver){

        ctx.fillStyle=
        "rgba(0,0,0,0.7)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle="red";
        ctx.font="60px Arial";

        ctx.fillText(
            "GAME OVER",
            280,
            250
        );

        ctx.fillStyle="white";
        ctx.font="30px Arial";

        ctx.fillText(
            "Press Restart",
            360,
            320
        );

    }

}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

spawnCoin();
loop();

</script>

</body>
</html>
