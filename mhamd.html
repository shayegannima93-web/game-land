<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open City 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial}
canvas{display:block}
#menu{position:fixed;inset:0;z-index:99;background:linear-gradient(#102633,#05090c);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
#menu h1{font-size:48px;margin:0 0 25px}
#start{font-size:22px;padding:15px 50px;border:0;border-radius:10px;cursor:pointer;background:#1976d2;color:white}
#msg{margin-top:15px;color:#ff7777}
#ui{position:fixed;top:12px;left:12px;z-index:10;color:#fff;background:#000b;padding:10px 15px;border-radius:10px;line-height:1.8}
#cross{position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font-size:25px;pointer-events:none}
#inv{position:fixed;right:12px;bottom:12px;z-index:10;display:flex;gap:8px}
.slot{width:90px;height:55px;border:2px solid #888;border-radius:8px;background:#000c;color:white;text-align:center;padding-top:6px}
.active{border-color:#ffd600}
#help{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:10;background:#000b;color:white;padding:7px 12px;border-radius:8px}
</style>
</head>
<body>

<div id="menu">
<h1>OPEN CITY 3D</h1>
<button id="start">شروع بازی</button>
<div id="msg"></div>
</div>

<div id="ui">
❤️ <span id="hp">100</span><br>
⭐ <span id="score">0</span><br>
🚨 <span id="wanted">0</span>/5<br>
🎒 <span id="weapon">کلت</span><br>
🚗 <span id="car">پیاده</span>
</div>

<div id="cross">+</div>

<div id="inv">
<div id="s1" class="slot active">1<br>کلت</div>
<div id="s2" class="slot">2<br>RPG</div>
</div>

<div id="help">W/S حرکت · A/D چرخش · Shift سرعت · E ماشین · 1/2 سلاح · کلیک هدف‌گیری</div>

<script>
"use strict";

let THREE=null;
let scene,camera,renderer,clock;
let started=false;
let player,car=null;
let yaw=0;
let weapon="pistol";
let score=0,wanted=0,hp=100;

const keys={};
const buildings=[];
const cars=[];
const people=[];
const targets=[];
const police=[];

const $=x=>document.getElementById(x);

function loadThree(){
  return new Promise((resolve,reject)=>{
    if(window.THREE){
      resolve(window.THREE);
      return;
    }

    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
    s.onload=()=>{
      if(window.THREE) resolve(window.THREE);
      else reject();
    };
    s.onerror=reject;
    document.head.appendChild(s);
  });
}

$("start").onclick=async function(){

  $("start").disabled=true;
  $("start").textContent="در حال بارگذاری...";

  try{
    THREE=await loadThree();
    init();
  }catch(e){
    $("start").disabled=false;
    $("start").textContent="تلاش دوباره";
    $("msg").textContent="Three.js بارگذاری نشد؛ اینترنت را بررسی کن.";
  }
};

function init(){

  started=true;
  $("menu").style.display="none";

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x82c9ea);
  scene.fog=new THREE.Fog(0x82c9ea,100,900);

  camera=new THREE.PerspectiveCamera(
    70,
    innerWidth/innerHeight,
    .1,
    2000
  );

  renderer=new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff,0x446644,2));

  const sun=new THREE.DirectionalLight(0xffffff,2);
  sun.position.set(100,250,100);
  sun.castShadow=true;
  scene.add(sun);

  clock=new THREE.Clock();

  ground();
  roads();
  makeBuildings();
  makePlayer();
  makeCars();
  makePeople();
  makeTargets();

  camera.position.set(0,8,15);

  addEventListener("keydown",keyDown);
  addEventListener("keyup",keyUp);
  addEventListener("resize",resize);

  renderer.domElement.addEventListener("click",shoot);

  requestAnimationFrame(loop);
}

function ground(){
const g=new THREE.Mesh(
    new THREE.PlaneGeometry(1800,1800),
    new THREE.MeshStandardMaterial({color:0x559b50})
  );

  g.rotation.x=-Math.PI/2;
  g.receiveShadow=true;
  scene.add(g);
}

function roads(){

  const m=new THREE.MeshStandardMaterial({color:0x303030});

  function road(x,z,w,d){
    const r=new THREE.Mesh(
      new THREE.BoxGeometry(w,.1,d),m
    );
    r.position.set(x,.05,z);
    scene.add(r);
  }

  road(0,0,1800,55);
  road(0,0,55,1800);
  road(300,0,40,1800);
  road(-300,0,40,1800);
  road(0,300,1800,40);
  road(0,-300,1800,40);
}

function makeBuildings(){

  for(let x=-650;x<=650;x+=130){
    for(let z=-650;z<=650;z+=130){

      if(Math.abs(x%260)<70 || Math.abs(z%260)<70)
        continue;

      building(
        x,z,
        70,
        35+Math.random()*100,
        70
      );
    }
  }
}

function building(x,z,w,h,d){

  const group=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({
      color:[
        0x74777d,
        0x856f60,
        0x666d76,
        0x927b65
      ][Math.floor(Math.random()*4)]
    })
  );

  body.position.y=h/2;
  body.castShadow=true;
  group.add(body);

  const roof=new THREE.Mesh(
    new THREE.BoxGeometry(w+2,1,d+2),
    new THREE.MeshStandardMaterial({color:0x292929})
  );

  roof.position.y=h+.5;
  group.add(roof);

  const door=new THREE.Mesh(
    new THREE.BoxGeometry(6,10,.4),
    new THREE.MeshStandardMaterial({color:0x603b24})
  );

  door.position.set(0,5,d/2+.25);
  group.add(door);

  for(let y=15;y<h-6;y+=15){
    for(let xx=-w/2+12;xx<w/2-8;xx+=17){
      window3D(group,xx,y,d/2+.3);
      window3D(group,xx,y,-d/2-.3);
    }
  }

  group.position.set(x,0,z);
  scene.add(group);

  buildings.push({x,z,w,d});
}

function window3D(group,x,y,z){

  const frame=new THREE.Mesh(
    new THREE.BoxGeometry(7,5,.3),
    new THREE.MeshStandardMaterial({color:0x202020})
  );

  frame.position.set(x,y,z);
  group.add(frame);

  const glass=new THREE.Mesh(
    new THREE.BoxGeometry(5.5,3.7,.2),
    new THREE.MeshStandardMaterial({
      color:0x63b9d5,
      emissive:0x0c2027
    })
  );

  glass.position.set(x,y,z);
  group.add(glass);
}

function buildingCollision(x,z,r){

  for(const b of buildings){

    const cx=Math.max(
      b.x-b.w/2,
      Math.min(x,b.x+b.w/2)
    );

    const cz=Math.max(
      b.z-b.d/2,
      Math.min(z,b.z+b.d/2)
    );

    const dx=x-cx;
    const dz=z-cz;

    if(dx*dx+dz*dz<r*r)
      return true;
  }

  return false;
}

function makePlayer(){

  player=new THREE.Group();

  const skin=new THREE.MeshStandardMaterial({color:0xe0a27d});
  const shirt=new THREE.MeshStandardMaterial({color:0x286ac1});
  const pants=new THREE.MeshStandardMaterial({color:0x252535});

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(1.3,1.8,.7),shirt
  );
  body.position.y=2.2;
  player.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.58,20,20),skin
  );
  head.position.y=3.65;
  player.add(head);

  for(const side of [-1,1]){

    const arm=new THREE.Mesh(
      new THREE.BoxGeometry(.3,1.4,.3),skin
    );
    arm.position.set(side*.82,2.2,0);
    player.add(arm);

    const leg=new THREE.Mesh(
      new THREE.BoxGeometry(.4,1.7,.45),pants
    );
    leg.position.set(side*.3,.85,0);
    player.add(leg);
  }

  player.position.set(0,0,100);
  scene.add(player);
}

function makeCars(){

  const colors=[
    0xe53935,0x1e88e5,0xfdd835,
    0x43a047,0x8e24aa,0xfb8c00,
    0xffffff,0x202020
  ];

  const p=[
    [20,20],[-20,20],
    [20,-20],[-20,-20],
    [80,0],[-80,0],
    [0,80],[0,-80]
  ];

  p.forEach((v,i)=>makeCar(v[0],v[1],colors[i]));
}

function makeCar(x,z,color,police=false){

  const g=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(4.5,1.3,7),
    new THREE.MeshStandardMaterial({color})
  );
  body.position.y=1.3;
  body.castShadow=true;
  g.add(body);
const glass=new THREE.Mesh(
    new THREE.BoxGeometry(3.4,1.4,3.6),
    new THREE.MeshStandardMaterial({
      color:0x67bdd8,
      transparent:true,
      opacity:.82
    })
  );
  glass.position.set(0,2.3,0);
  g.add(glass);

  const front=new THREE.MeshStandardMaterial({
    color:0xffffbb,
    emissive:0x888833
  });

  const rear=new THREE.MeshStandardMaterial({
    color:0xff2222,
    emissive:0x440000
  });

  for(const side of [-1,1]){

    const f=new THREE.Mesh(
      new THREE.BoxGeometry(.7,.4,.2),front
    );
    f.position.set(side*1.4,1.45,-3.55);
    g.add(f);

    const r=new THREE.Mesh(
      new THREE.BoxGeometry(.7,.4,.2),rear
    );
    r.position.set(side*1.4,1.45,3.55);
    g.add(r);
  }

  for(const side of [-1,1]){
    for(const zside of [-1,1]){

      const w=new THREE.Mesh(
        new THREE.CylinderGeometry(.72,.72,.55,16),
        new THREE.MeshStandardMaterial({color:0x111111})
      );

      w.rotation.z=Math.PI/2;
      w.position.set(side*2,.72,zside*2.3);
      g.add(w);
    }
  }

  if(police){

    const siren=new THREE.Mesh(
      new THREE.BoxGeometry(1.5,.35,.6),
      new THREE.MeshStandardMaterial({
        color:0xff2222,
        emissive:0xff0000
      })
    );

    siren.position.y=3.1;
    g.add(siren);
  }

  g.position.set(x,0,z);
  g.userData={radius:3.5,police};

  scene.add(g);
  cars.push(g);

  return g;
}

function makePeople(){

  for(let i=0;i<60;i++){

    const p=new THREE.Group();

    const body=new THREE.Mesh(
      new THREE.BoxGeometry(.8,1.5,.55),
      new THREE.MeshStandardMaterial({
        color:0x456789
      })
    );
    body.position.y=1.5;
    p.add(body);

    const head=new THREE.Mesh(
      new THREE.SphereGeometry(.45,14,14),
      new THREE.MeshStandardMaterial({color:0xe0a27d})
    );
    head.position.y=2.65;
    p.add(head);

    let x,z;

    do{
      x=-700+Math.random()*1400;
      z=-700+Math.random()*1400;
    }while(buildingCollision(x,z,2));

    p.position.set(x,0,z);
    p.userData={
      a:Math.random()*Math.PI*2,
      t:Math.random()*4
    };

    scene.add(p);
    people.push(p);
  }
}

function makeTargets(){

  const pos=[
    [180,80],[-180,80],
    [180,-80],[-180,-80],
    [80,180],[-80,-180]
  ];

  for(const [x,z] of pos){

    const t=new THREE.Group();

    const stand=new THREE.Mesh(
      new THREE.CylinderGeometry(.7,.7,.3,16),
      new THREE.MeshStandardMaterial({color:0x333333})
    );
    stand.position.y=.15;
    t.add(stand);

    const disk=new THREE.Mesh(
      new THREE.CylinderGeometry(1.3,1.3,.35,24),
      new THREE.MeshStandardMaterial({
        color:0xff3333
      })
    );

    disk.rotation.x=Math.PI/2;
    disk.position.y=2;
    t.add(disk);

    t.position.set(x,0,z);
    scene.add(t);
    targets.push(t);
  }
}

function keyDown(e){

  keys[e.key.toLowerCase()]=true;

  if(e.key==="1")selectWeapon("pistol");
  if(e.key==="2")selectWeapon("rpg");

  if(e.key.toLowerCase()==="e")
    toggleCar();
}

function keyUp(e){
  keys[e.key.toLowerCase()]=false;
}

function selectWeapon(w){

  weapon=w;

  $("s1").classList.toggle("active",w==="pistol");
  $("s2").classList.toggle("active",w==="rpg");

  $("weapon").textContent=
    w==="pistol"?"کلت":"RPG";
}

function toggleCar(){

  if(car){

    const x=car.position.x+7;
    const z=car.position.z;

    if(!buildingCollision(x,z,1)){
      player.position.set(x,0,z);
      player.visible=true;
      car=null;
    }

    return;
  }

  let best=null;
  let d=8;

  for(const c of cars){

    if(c.userData.police)continue;

    const dist=player.position.distanceTo(c.position);

    if(dist<d){
      d=dist;
      best=c;
    }
  }

  if(best){
    car=best;
    player.visible=false;
  }
}

function move(dt){

  const obj=car||player;

  if(keys.a)yaw+=2.5*dt;
  if(keys.d)yaw-=2.5*dt;

  obj.rotation.y=yaw;

  let speed=car?18:7;
  if(keys.shift)speed*=1.5;

  let direction=0;
  if(keys.w)direction=1;
  if(keys.s)direction=-1;

  if(!direction)return;

  const dx=-Math.sin(yaw)*speed*dt*direction;
  const dz=-Math.cos(yaw)*speed*dt*direction;
if(!car){

    const x=player.position.x+dx;
    const z=player.position.z+dz;

    if(!buildingCollision(x,z,1))
      player.position.set(x,0,z);

  }else{

    const x=car.position.x+dx;
    const z=car.position.z+dz;

    if(!buildingCollision(x,z,3.5))
      car.position.set(x,0,z);
  }
}

function shoot(){

  if(!started)return;

  const ray=new THREE.Raycaster();

  ray.setFromCamera(
    new THREE.Vector2(0,0),
    camera
  );

  const meshes=[];

  for(const t of targets)
    t.traverse(o=>{
      if(o.isMesh)meshes.push(o);
    });

  const hit=ray.intersectObjects(meshes,false);

  if(hit.length){

    const target=targets.find(t=>{
      let yes=false;
      t.traverse(o=>{
        if(o===hit[0].object)yes=true;
      });
      return yes;
    });

    if(target){

      scene.remove(target);

      const i=targets.indexOf(target);
      if(i>=0)targets.splice(i,1);

      score+=weapon==="rpg"?250:100;
      wanted=Math.min(5,wanted+1);

      updateUI();
    }
  }
}

function updatePeople(dt){

  for(const p of people){

    p.userData.t-=dt;

    if(p.userData.t<=0){

      p.userData.a=Math.random()*Math.PI*2;
      p.userData.t=1+Math.random()*4;
    }

    const a=p.userData.a;

    const x=p.position.x+Math.sin(a)*1.5*dt;
    const z=p.position.z+Math.cos(a)*1.5*dt;

    if(!buildingCollision(x,z,.7))
      p.position.set(x,0,z);
  }
}

function updatePolice(dt){

  while(police.length<wanted){

    const a=Math.random()*Math.PI*2;

    const p=makeCar(
      player.position.x+Math.cos(a)*100,
      player.position.z+Math.sin(a)*100,
      0xffffff,
      true
    );

    police.push(p);
  }

  for(const p of police){

    const dx=player.position.x-p.position.x;
    const dz=player.position.z-p.position.z;

    const a=Math.atan2(dx,dz);

    p.rotation.y=a;

    const speed=7+wanted*2;

    const x=p.position.x+Math.sin(a)*speed*dt;
    const z=p.position.z+Math.cos(a)*speed*dt;

    if(!buildingCollision(x,z,3.5))
      p.position.set(x,0,z);
  }
}

function cameraUpdate(dt){

  const target=car||player;
  const distance=car?18:12;

  const desired=new THREE.Vector3(
    target.position.x+Math.sin(yaw)*distance,
    target.position.y+7,
    target.position.z+Math.cos(yaw)*distance
  );

  camera.position.lerp(desired,Math.min(1,dt*7));

  camera.lookAt(
    target.position.x,
    target.position.y+2,
    target.position.z
  );
}

function updateUI(){

  $("hp").textContent=hp;
  $("score").textContent=score;
  $("wanted").textContent=wanted;
  $("car").textContent=car?"داخل ماشین":"پیاده";
}

function resize(){

  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}

function loop(){

  if(!started)return;

  requestAnimationFrame(loop);

  const dt=Math.min(clock.getDelta(),.05);

  move(dt);
  updatePeople(dt);
  updatePolice(dt);
  cameraUpdate(dt);
  updateUI();

  renderer.render(scene,camera);
}
</script>
</body>
</html>
